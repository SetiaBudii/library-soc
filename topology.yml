name: library-wazuh-single
hosts:
  - name: wazuh-server
    base_box:
      image: ubuntu-noble-x86_64
      man_user: ubuntu
    flavor: wazuh.custom
routers:
  - name: wazuh-router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: standard.small
networks:
  - name: wazuh-net
    cidr: 10.1.60.0/24
    accessible_by_user: True
net_mappings:
  - host: wazuh-server
    network: wazuh-net
    ip: 10.1.60.5
router_mappings:
  - router: wazuh-router
    network: wazuh-net
    ip: 10.1.60.1
groups: []
