name: wazuh-simple-lab
hosts:
  - name: target
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
  - name: wazuh
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.large
  - name: workstation
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.medium
routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
wan:
  name: internet-connection
  cidr: 100.100.100.0/24
networks:
  - name: target-switch
    cidr: 10.1.26.0/24
    accessible_by_user: False
  - name: access-switch
    cidr: 10.1.27.0/24
net_mappings:
  - host: target
    network: target-switch
    ip: 10.1.26.9
  - host: wazuh
    network: access-switch
    ip: 10.1.27.10
  - host: workstation
    network: access-switch
    ip: 10.1.27.15
router_mappings:
  - router: router
    network: target-switch
    ip: 10.1.26.1
  - router: router
    network: access-switch
    ip: 10.1.27.1
groups: []
